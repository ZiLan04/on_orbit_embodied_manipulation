run_id: 20260928-starlink-cube-oracle-action-head-10k-v1
run_root_dir: /data/Yanhan/genesis/runs
output_dir: /data/Yanhan/genesis/runs/20260928-starlink-cube-oracle-action-head-10k-v1
seed: 42
wandb_entity: null
wandb_project: starlink-vla
is_debug: false
framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /data/VLA_model/StarVLA/repo/playground/Pretrained_models/Qwen2.5-VL-3B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /data/Yanhan/genesis/runs/20260928-starlink-cube-oracle-v1
    data_mix: starlink_cube_vla
    action_type: delta_ee
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
trainer:
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 2500
  eval_interval: 10001
  pretrained_checkpoint: /data/VLA_model/StarVLA/models/StarVLA-Calvin_D_D-Qwen2.5-VL-3B/checkpoints/steps_30000_pytorch_model.pt
  freeze_modules: qwen_vl_interface
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  logging_frequency: 50
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  loss_scale:
    vla: 1.0
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
